<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Call Deck">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Call Deck</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --text:#f2f4f8; --dim:#9aa3b2; --accent:#4c8dff; --green:#2ecc71; --red:#e05a5a; --line:#2a3040; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html { scroll-snap-type:y mandatory; background:var(--bg); }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .lead { height:100vh; height:100svh; scroll-snap-align:start; scroll-snap-stop:always; display:flex; padding:10px; padding-top:calc(10px + env(safe-area-inset-top)); padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 15px; width:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; min-height:0; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .brand { font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .count { font-size:14px; font-weight:800; white-space:nowrap; }
  .count .donect { color:var(--green); font-size:11px; font-weight:800; margin-left:6px; }
  .pbar { height:3px; background:var(--line); border-radius:2px; margin-top:7px; overflow:hidden; }
  .pbar > div { height:100%; background:var(--accent); }
  .name { font-size:22px; font-weight:800; line-height:1.15; margin-top:11px; }
  .ptitle { font-size:13px; color:var(--dim); margin-top:2px; }
  .co { font-size:15.5px; font-weight:800; color:var(--accent); margin-top:7px; }
  .loc { font-size:13px; color:var(--dim); margin-top:3px; }
  .loc b { color:var(--text); }
  .stats { display:flex; gap:8px; margin-top:9px; }
  .stat { flex:1; background:rgba(255,255,255,.04); border-radius:11px; padding:6px 11px; }
  .stat .k { font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .stat .v { font-size:14px; font-weight:800; margin-top:1px; }
  .sib { display:none; font-size:11.5px; font-weight:700; border-radius:9px; padding:7px 10px; margin-top:9px; line-height:1.35; }
  .sib.warn { display:block; background:rgba(224,90,90,.12); color:#ff9d9d; border:1px solid rgba(224,90,90,.35); }
  .sib.info { display:block; background:rgba(46,204,113,.10); color:var(--green); border:1px solid rgba(46,204,113,.3); }
  .dial { display:block; text-align:center; text-decoration:none; background:var(--green); color:#06220f; font-size:17.5px; font-weight:800; border-radius:13px; padding:12px; margin-top:10px; }
  .dial small { display:block; font-size:9px; font-weight:800; opacity:.75; margin-top:2px; letter-spacing:.05em; }
  .dial.nodial { background:rgba(255,255,255,.06); color:var(--dim); font-size:14px; padding:14px; }
  .backups { text-align:center; font-size:12px; color:var(--dim); margin-top:6px; line-height:1.6; }
  .bnum { color:var(--text); font-weight:700; text-decoration:none; }
  .btype { font-size:11px; }
  .email-copy { color:#8ab4ff; font-weight:700; cursor:pointer; }
  .links { display:flex; gap:7px; margin-top:8px; }
  .lnk { flex:1; text-align:center; text-decoration:none; background:rgba(76,141,255,.13); color:#8ab4ff; font-size:12px; font-weight:700; border-radius:10px; padding:9px 2px; }
  .ind { font-size:12px; color:var(--dim); margin-top:9px; }
  .ind b { color:var(--text); }
  .about { font-size:12px; line-height:1.4; margin-top:4px; }
  .note { font-size:11.5px; color:#e8b64a; margin-top:7px; line-height:1.4; overflow-y:auto; flex:0 1 auto; min-height:0; background:rgba(232,182,74,.07); border-radius:9px; padding:8px 10px; }
  .mynote { display:block; width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:9px; color:var(--text); font-size:12px; line-height:1.4; font-family:inherit; padding:7px 9px; margin-top:7px; height:38px; resize:none; }
  .mynote:focus { outline:none; border-color:var(--accent); }
  .mynote::placeholder { color:var(--dim); opacity:.7; }
  .done { display:block; text-align:center; margin-top:auto; padding:8px; border:1px solid var(--line); border-radius:10px; font-size:12px; font-weight:700; color:var(--dim); cursor:pointer; user-select:none; -webkit-user-select:none; }
  .done.on { background:rgba(46,204,113,.15); color:var(--green); border-color:rgba(46,204,113,.4); }
  .navrow { display:flex; gap:8px; margin-top:8px; }
  .nav { flex:1; text-align:center; text-decoration:none; font-size:19px; font-weight:800; border-radius:12px; padding:8px 0; border:1px solid var(--line); color:var(--text); cursor:pointer; background:none; font-family:inherit; }
  .nav.next { flex:2.4; background:var(--accent); border-color:var(--accent); color:#fff; }
  .nav.skip { font-size:13px; line-height:1.2; padding-top:5px; color:var(--green); border-color:rgba(46,204,113,.35); }
  .nav.skip small { display:block; font-size:8px; font-weight:800; letter-spacing:.05em; opacity:.75; }
  .nav.off { opacity:.3; pointer-events:none; }
  .sumwrap { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; flex:1; gap:10px; }
  .sumbig { font-size:44px; font-weight:800; color:var(--green); }
  .sumtxt { font-size:14px; color:var(--dim); line-height:1.5; }
  .reset { background:none; border:1px solid var(--line); color:var(--dim); font-size:12px; font-weight:700; border-radius:10px; padding:10px 18px; cursor:pointer; font-family:inherit; margin-top:14px; }
</style>
</head>
<body>
<script type="application/json" id="leads-data">__LEADS_JSON__</script>
<div id="deck"></div>
<script>
function initDeck(DATA){
  var LIST = DATA.listId;
  var QUO_FROM = DATA.quoFrom || '';
  var KEY_CALLED = 'calldeck:' + LIST + ':called2';
  var KEY_POS = 'calldeck:' + LIST + ':pos';
  var KEY_NOTES = 'calldeck:' + LIST + ':notes';

  // called = { leadIndex: epochMs }
  function loadCalled(){
    try {
      var v = JSON.parse(localStorage.getItem(KEY_CALLED) || '{}');
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } catch(e){ return {}; }
  }
  function saveCalled(){ try { localStorage.setItem(KEY_CALLED, JSON.stringify(called)); } catch(e){} }
  var called = loadCalled();
  function calledCount(){ return Object.keys(called).length; }

  function loadNotes(){
    try {
      var v = JSON.parse(localStorage.getItem(KEY_NOTES) || '{}');
      return (v && typeof v === 'object') ? v : {};
    } catch(e){ return {}; }
  }
  var notes = loadNotes();
  function saveNotes(){ try { localStorage.setItem(KEY_NOTES, JSON.stringify(notes)); } catch(e){} }

  function exportBlob(){
    var entries = [];
    DATA.leads.forEach(function(l, i){
      var note = (notes[i] || '').trim();
      if (called[i] == null && !note) return;
      entries.push({
        n: i + 1, name: l.name, company: l.company,
        called: called[i] != null ? new Date(called[i]).toISOString() : null,
        note: note || null
      });
    });
    return 'CALL DECK EXPORT — file these for me (e.g. into Attio):\n' + JSON.stringify({
      listId: DATA.listId, listName: DATA.listName,
      exportedAt: new Date().toISOString(), entries: entries
    }, null, 1);
  }
  function copyText(t, btn){
    function ok(){ btn.textContent = '✓ Copied — paste it to Claude'; setTimeout(function(){ btn.textContent = 'Copy notes + status for Claude'; }, 2500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok, function(){ legacyCopy(t); ok(); });
    } else { legacyCopy(t); ok(); }
  }
  function legacyCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  }

  function esc(t){ var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
  function digitsOf(tel){ return String(tel || '').split(',')[0].replace(/[^\d]/g, ''); }
  function quoHref(tel){
    var base = String(tel || '').split(',')[0];
    return 'openphone://dial?number=' + encodeURIComponent(base) +
           (QUO_FROM ? '&from=' + encodeURIComponent(QUO_FROM) : '') + '&action=call';
  }
  function primaryOf(l){
    var ns = l.numbers || [];
    for (var i = 0; i < ns.length; i++) if (ns[i].primary && !ns[i].dnc) return i;
    for (var i = 0; i < ns.length; i++) if (!ns[i].dnc) return i;
    return -1;
  }
  function fmtAgo(ts){
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var h = Math.round(mins / 60);
    if (h < 24) return h + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }

  function render(){
    var n = DATA.leads.length, html = '';
    DATA.leads.forEach(function(l, i){
      var num = i + 1;
      var pct = (num / n * 100).toFixed(1);
      var pi = primaryOf(l);
      html += '<section class="lead" id="c' + num + '"><div class="card">';
      html += '<div class="top"><span class="brand">' + esc(l.brand) + '</span><span class="count">' + num + ' / ' + n + '<span class="donect" id="dc' + num + '"></span></span></div>';
      html += '<div class="pbar"><div style="width:' + pct + '%"></div></div>';
      html += '<div class="name">' + esc(l.name) + '</div>';
      html += '<div class="ptitle">' + esc(l.title) + '</div>';
      html += '<div class="co">' + esc(l.company) + '</div>';
      html += '<div class="loc">' + esc(l.location) + (l.tz ? ' — <b>' + esc(l.tz) + '</b>' : '') + '</div>';
      html += '<div class="stats"><div class="stat"><div class="k">Revenue</div><div class="v">' + esc(l.revenue || '—') + '</div></div><div class="stat"><div class="k">Employees</div><div class="v">' + esc(l.employees || '—') + '</div></div></div>';
      html += '<div class="sib" id="sib' + num + '"></div>';
      if (pi >= 0) {
        var p = l.numbers[pi];
        html += '<a class="dial" href="' + esc(quoHref(p.tel)) + '">&#128222; ' + esc(p.display) + '<small>' + esc((p.type || 'PHONE').toUpperCase()) + ' — CALL VIA QUO</small></a>';
      } else {
        html += '<div class="dial nodial">No callable number' + ((l.numbers || []).length ? ' — do-not-call only' : ' listed') + '</div>';
      }
      var others = (l.numbers || []).filter(function(x, xi){ return xi !== pi && !x.dnc; });
      if (others.length) {
        html += '<div class="backups">' + others.map(function(b){
          return '<a class="bnum" href="' + esc(quoHref(b.tel)) + '">' + esc(b.display) + '</a> <span class="btype">(' + esc(b.type) + ')</span>';
        }).join(' &nbsp;·&nbsp; ') + '</div>';
      }
      if (l.links && l.links.length) {
        html += '<div class="links">' + l.links.map(function(k){
          return '<a class="lnk" href="' + esc(k.href) + '" target="_blank" rel="noopener">' + esc(k.label) + '</a>';
        }).join('') + '</div>';
      }
      if (l.industry) html += '<div class="ind"><b>Industry:</b> ' + esc(l.industry) + '</div>';
      if (l.email) html += '<div class="ind"><b>Email:</b> <span class="email-copy" data-e="' + esc(l.email) + '">' + esc(l.email) + '</span></div>';
      if (l.about) html += '<div class="about">' + esc(l.about) + '</div>';
      html += '<textarea class="mynote" data-i="' + i + '" placeholder="Your notes… (saved on this phone)" rows="2"></textarea>';
      html += '<div class="done" data-i="' + i + '" role="button">Mark as called</div>';
      html += '<div class="navrow">';
      html += (i > 0 ? '<a class="nav prev" href="#c' + i + '">&#8593;</a>' : '<span class="nav prev off">&#8593;</span>');
      html += '<button class="nav skip" data-i="' + i + '">&#9193;<small>NEXT UNCALLED</small></button>';
      html += (i < n - 1 ? '<a class="nav next" href="#c' + (num + 1) + '">&#8595;</a>' : '<a class="nav next" href="#sum">&#8595;</a>');
      html += '</div></div></section>';
    });
    html += '<section class="lead" id="sum"><div class="card"><div class="top"><span class="brand">' + esc(DATA.listName) + '</span><span class="count">&#10003;</span></div><div class="pbar"><div style="width:100%"></div></div>';
    html += '<div class="sumwrap"><div class="sumbig" id="sumnum"></div><div class="sumtxt" id="sumtxt"></div><button class="reset" id="exportbtn">Copy notes + status for Claude</button><button class="reset" id="resetbtn">Reset progress</button></div>';
    html += '<div class="navrow"><a class="nav prev" href="#c' + n + '">&#8593;</a><a class="nav next" href="#c1">Back to top</a></div>';
    html += '</div></section>';
    document.getElementById('deck').innerHTML = html;
  }

  // precompute sibling relations
  var byCompany = {}, byNumber = {};
  DATA.leads.forEach(function(l, i){
    var co = (l.company || '').toLowerCase().trim();
    if (co) (byCompany[co] = byCompany[co] || []).push(i);
    (l.numbers || []).forEach(function(nn){
      if (nn.dnc) return;
      var d = digitsOf(nn.tel);
      if (d) (byNumber[d] = byNumber[d] || []).push(i);
    });
  });

  function siblingState(i){
    var l = DATA.leads[i];
    // warn when a called sibling's PRIMARY number (the one they were most likely
    // dialed on) is also one of this lead's numbers
    var mine = {};
    (l.numbers || []).forEach(function(nn){ if (!nn.dnc) mine[digitsOf(nn.tel)] = true; });
    var hit = null;
    DATA.leads.forEach(function(o, j){
      if (j === i || called[j] == null) return;
      var pj = primaryOf(o);
      if (pj < 0) return;
      if (mine[digitsOf(o.numbers[pj].tel)] && (hit == null || called[j] > called[hit])) hit = j;
    });
    if (hit != null) return { type: 'warn', j: hit };
    var co = (l.company || '').toLowerCase().trim();
    var jj = null;
    (byCompany[co] || []).forEach(function(j){
      if (j !== i && called[j] != null && (jj == null || called[j] > called[jj])) jj = j;
    });
    if (jj != null) return { type: 'info', j: jj };
    return null;
  }

  function paint(){
    var n = DATA.leads.length;
    document.querySelectorAll('.done').forEach(function(el){
      var i = +el.dataset.i;
      var on = called[i] != null;
      el.classList.toggle('on', on);
      el.innerHTML = on ? '&#10003; Called' : 'Mark as called';
    });
    var cc = calledCount();
    for (var j = 1; j <= n; j++) {
      var dc = document.getElementById('dc' + j);
      if (dc) dc.textContent = cc ? cc + ' done' : '';
      var sibEl = document.getElementById('sib' + j);
      if (sibEl) {
        var s = (called[j - 1] == null) ? siblingState(j - 1) : null;
        if (s) {
          var other = DATA.leads[s.j];
          sibEl.className = 'sib ' + s.type;
          sibEl.innerHTML = s.type === 'warn'
            ? '&#9888; Same number — you already called ' + esc(other.name) + ' (' + fmtAgo(called[s.j]) + ')'
            : '&#10003; ' + esc(other.name) + ' at ' + esc(other.company) + ' already called (' + fmtAgo(called[s.j]) + ')';
        } else {
          sibEl.className = 'sib';
          sibEl.innerHTML = '';
        }
      }
    }
    var sn = document.getElementById('sumnum'), st = document.getElementById('sumtxt');
    if (sn) sn.textContent = cc + ' / ' + n;
    if (st) st.textContent = cc >= n ? 'Deck complete. Go get some water.' : (n - cc) + ' left to call. Tap NEXT UNCALLED to jump back in.';
  }

  function nextUncalled(from){
    var n = DATA.leads.length;
    for (var s = 1; s <= n; s++) {
      var i = (from + s) % n;
      if (called[i] == null) return i;
    }
    return null;
  }

  function goTo(i){
    var el = document.getElementById('c' + (i + 1));
    if (el) el.scrollIntoView();
  }

  render();
  paint();

  // restore + autosave notes
  document.querySelectorAll('.mynote').forEach(function(ta){
    var i = +ta.dataset.i;
    if (notes[i]) ta.value = notes[i];
  });
  var noteTimer = null;
  document.getElementById('deck').addEventListener('input', function(e){
    var ta = e.target.closest('.mynote');
    if (!ta) return;
    var i = +ta.dataset.i;
    if (ta.value.trim()) notes[i] = ta.value; else delete notes[i];
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveNotes, 400);
  });

  document.getElementById('deck').addEventListener('click', function(e){
    var em = e.target.closest('.email-copy');
    if (em) {
      var addr = em.dataset.e;
      legacyCopy(addr);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(addr).catch(function(){});
      var orig = em.textContent;
      em.textContent = '✓ copied';
      setTimeout(function(){ em.textContent = orig; }, 1200);
      return;
    }
    var d = e.target.closest('.done');
    if (d) {
      var i = +d.dataset.i;
      if (called[i] != null) delete called[i]; else called[i] = Date.now();
      saveCalled();
      paint();
      return;
    }
    var sk = e.target.closest('.nav.skip');
    if (sk) {
      var j = nextUncalled(+sk.dataset.i);
      if (j !== null) goTo(j);
      return;
    }
    if (e.target.closest('#exportbtn')) {
      copyText(exportBlob(), e.target.closest('#exportbtn'));
      return;
    }
    if (e.target.closest('#resetbtn')) {
      called = {}; saveCalled(); paint();
    }
  });

  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting && en.intersectionRatio > 0.6) {
        var m = en.target.id.match(/^c(\d+)$/);
        if (m) try { localStorage.setItem(KEY_POS, m[1]); } catch(e){}
      }
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('section.lead').forEach(function(s){ obs.observe(s); });

  var pos = parseInt(localStorage.getItem(KEY_POS) || '1', 10);
  if (pos > 1 && pos <= DATA.leads.length) {
    requestAnimationFrame(function(){ goTo(pos - 1); });
  }
}

(function boot(){
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById('leads-data').textContent); } catch(e){}
  if (DATA && DATA.leads) { initDeck(DATA); return; }

  function fail(msg){
    document.getElementById('deck').innerHTML =
      '<section class="lead"><div class="card"><div class="sumwrap"><div class="sumbig">&#9888;</div><div class="sumtxt">' + msg + '</div></div></div></section>';
  }

  var KEYSTORE = 'calldeck:key';
  var m = (location.hash || '').match(/k=([A-Za-z0-9_-]+)/);
  var kb64 = (m && m[1]) || null;
  try { kb64 = kb64 || localStorage.getItem(KEYSTORE); } catch(e){}
  if (!kb64) { fail('This deck is locked. Open it from your original link (the one with the key in it) once, and it will remember.'); return; }

  var raw;
  try {
    raw = Uint8Array.from(atob(kb64.replace(/-/g, '+').replace(/_/g, '/')), function(c){ return c.charCodeAt(0); });
  } catch(e){ fail('Bad key in link.'); return; }

  crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function(key){
    return fetch('leads.enc?ts=' + Date.now(), { cache: 'no-store' }).then(function(res){
      if (!res.ok) throw new Error('fetch ' + res.status);
      return res.arrayBuffer();
    }).then(function(buf){
      var b = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12));
    });
  }).then(function(pt){
    try { localStorage.setItem(KEYSTORE, kb64); } catch(e){}
    initDeck(JSON.parse(new TextDecoder().decode(pt)));
  }).catch(function(e){
    fail('Could not load the lead list. Check your connection and reload. (' + (e && e.message || e) + ')');
  });
})();
</script>
</body>
</html>
